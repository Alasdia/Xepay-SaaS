<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Xepay</title>
<!-- Shell SPA : ce fichier est le point de montage unique du Dashboard.
     Le contenu spécifique à chaque vue (Dashboard, Transactions, Liens,
     API, Multi-users, Profil, Sécurité) est injecté dynamiquement par
     spa/app.js dans #main-content — voir spa/views/*.js. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;500;600&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/sidebar.css">
<link rel="stylesheet" href="/modal-upgrade.css">
<!-- Skeleton de navigation : chargé en permanence, il doit être stylé avant
     le CSS propre à la vue (chargé dynamiquement par styleLoader.js). -->
<link rel="stylesheet" href="/skeleton.css">
</head>
<body class="d-flex" style="margin: 0; padding: 0;">
<!-- Le dégagement de base de #main-content (margin-left:260px + comportement
     responsive de la sidebar) est défini une seule fois, partagé entre les
     7 vues, dans sidebar.css (toujours chargé, jamais permuté). Chaque vue
     peut surcharger padding/width via son propre CSS, chargé dynamiquement
     par spa/core/styleLoader.js, sans avoir à redéclarer le dégagement
     partagé lui-même. -->
<div id="sidebar-container"></div>
<div id="main-content"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://connect-js.stripe.com/v1.0/connect.js"></script>
<div id="toast-container" class="toast-notif"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/spa/app.js"></script>
</body>
</html>
