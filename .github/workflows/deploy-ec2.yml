name: Deploy backend to AWS EC2

# Déploiement automatique de l'instance EC2 Xepay_backendServer via AWS
# Systems Manager (SSM Run Command) - aucun port SSH ouvert publiquement,
# authentification GitHub Actions -> AWS par OIDC (pas de clé statique).
# Complète le déploiement Railway existant (.railway/railway.ts), ne le
# remplace pas.
#
# Ce pipeline n'injecte PAS de secrets via SSM Parameter Store/Secrets
# Manager : .env est un fichier statique déjà présent sur l'instance EC2
# (jamais versionné, jamais touché par ce workflow), simplement sourcé par
# la commande alembic ci-dessous. Les deux lignes "grep -q ... || echo ..."
# (ajoutées le 2026-11-22 pour BildBus/doola) ne font qu'ajouter les clés
# DOOLA_API_KEY/DOOLA_WEBHOOK_SECRET/BILDBUS_ALLOW_MOCK à ce fichier SI
# ELLES SONT ABSENTES (idempotent, jamais d'écrasement d'une vraie valeur
# déjà en place) - sans ça, le premier déploiement après l'ajout de ces
# variables dans le code aurait laissé os.getenv(...) renvoyer None
# silencieusement, ce qui est déjà géré sans crash (voir doola_client.py),
# mais autant que le fichier .env de prod reflète dès maintenant les clés
# qu'il faudra renseigner une fois reçues de doola.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  INSTANCE_ID: i-09ee4fadf69bce177
  AWS_REGION: eu-north-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::372684705781:role/GithubActions-Xepay-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM Run Command
        run: |
          cat > params.json << 'EOF'
          {
            "commands": [
              "set -e",
              "cd /home/ec2-user/xepay",
              "git fetch origin main",
              "git reset --hard origin/main",
              "./venv/bin/pip install -r requirements.txt",
              "grep -q '^DOOLA_API_KEY=' .env || echo 'DOOLA_API_KEY=' >> .env",
              "grep -q '^DOOLA_WEBHOOK_SECRET=' .env || echo 'DOOLA_WEBHOOK_SECRET=' >> .env",
              "grep -q '^BILDBUS_ALLOW_MOCK=' .env || echo 'BILDBUS_ALLOW_MOCK=false' >> .env",
              "set -a; . ./.env; set +a; ./venv/bin/alembic upgrade head",
              "systemctl restart xepay-backend",
              "sleep 5",
              "curl -sf http://127.0.0.1:8000/health"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://params.json \
            --comment "GitHub Actions deploy ${{ github.sha }}" \
            --query "Command.CommandId" --output text)

          echo "Command ID: $COMMAND_ID"
          sleep 3
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json | tee invocation.json

          STATUS=$(jq -r .Status invocation.json)
          if [ "$STATUS" != "Success" ]; then
            echo "Déploiement échoué (status=$STATUS)"
            exit 1
          fi
