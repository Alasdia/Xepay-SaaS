name: Deploy backend to AWS EC2

# Déploiement automatique de l'instance EC2 Xepay_backendServer via AWS
# Systems Manager (SSM Run Command) - aucun port SSH ouvert publiquement,
# authentification GitHub Actions -> AWS par OIDC (pas de clé statique).
# Complète le déploiement Railway existant (.railway/railway.ts), ne le
# remplace pas.
#
# Ce pipeline n'injecte PAS de secrets via SSM Parameter Store/Secrets
# Manager : .env est un fichier statique déjà présent sur l'instance EC2
# (jamais versionné, jamais touché par ce workflow), simplement sourcé par
# la commande alembic ci-dessous. Les deux lignes "grep -q ... || echo ..."
# (ajoutées le 2026-11-22 pour Buildness/doola) ne font qu'ajouter les clés
# DOOLA_API_KEY/DOOLA_WEBHOOK_SECRET/BUILDNESS_ALLOW_MOCK à ce fichier SI
# ELLES SONT ABSENTES (idempotent, jamais d'écrasement d'une vraie valeur
# déjà en place) - sans ça, le premier déploiement après l'ajout de ces
# variables dans le code aurait laissé os.getenv(...) renvoyer None
# silencieusement, ce qui est déjà géré sans crash (voir doola_client.py),
# mais autant que le fichier .env de prod reflète dès maintenant les clés
# qu'il faudra renseigner une fois reçues de doola.
#
# Le "sleep 5" fixe avant le curl de santé a produit un faux négatif sur
# le déploiement de Buildness (run du 2026-11-21, alors encore nommé
# "BildBus") : le serveur a mis un peu plus de 5s à redémarrer (chaîne
# d'imports plus lourde), le curl est arrivé trop tôt, et le pipeline a
# signalé un échec alors que le serveur, vérifié depuis l'extérieur
# quelques secondes plus tard, tournait déjà normalement.
#
# Remplacé une première fois (même jour) par "timeout 30 bash -c 'until
# curl ...; do sleep 1; done'" - qui a en réalité fonctionné sur les deux
# déploiements suivants (runs PR #47 et #48, tous deux "success", serveur
# vérifié sain derrière), MAIS imbriquait un bash -c '...' à guillemets
# simples dans une chaîne JSON elle-même dans un heredoc YAML - une
# imbrication de guillemets sur 3 niveaux, fragile à relire/maintenir
# même quand elle marche. Réécrit le 2026-11-22 (2e fois) en une boucle
# "until" à plat (pas de bash -c, pas de "timeout" externe, juste un
# compteur $i borné à 30), pour que chaque niveau de guillemets reste
# visible d'un coup d'œil. Techniquement, "set -e" (posé plus haut) n'a
# jamais empêché cette boucle de retenter : la condition d'un
# while/until est explicitement exemptée d'errexit par bash (POSIX) -
# seul le curl FINAL après la boucle (hors condition, donc soumis à
# set -e) fait échouer le script si les 30 tentatives n'ont rien donné.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  INSTANCE_ID: i-09ee4fadf69bce177
  AWS_REGION: eu-north-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::372684705781:role/GithubActions-Xepay-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM Run Command
        run: |
          cat > params.json << 'EOF'
          {
            "commands": [
              "set -e",
              "cd /home/ec2-user/xepay",
              "git fetch origin main",
              "git reset --hard origin/main",
              "./venv/bin/pip install -r requirements.txt",
              "grep -q '^DOOLA_API_KEY=' .env || echo 'DOOLA_API_KEY=' >> .env",
              "grep -q '^DOOLA_WEBHOOK_SECRET=' .env || echo 'DOOLA_WEBHOOK_SECRET=' >> .env",
              "grep -q '^BUILDNESS_ALLOW_MOCK=' .env || echo 'BUILDNESS_ALLOW_MOCK=false' >> .env",
              "set -a; . ./.env; set +a; ./venv/bin/alembic upgrade head",
              "systemctl restart xepay-backend",
              "i=0; until curl -sf -o /dev/null http://127.0.0.1:8000/health || [ $i -ge 30 ]; do i=$((i+1)); sleep 1; done",
              "curl -sf http://127.0.0.1:8000/health"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://params.json \
            --comment "GitHub Actions deploy ${{ github.sha }}" \
            --query "Command.CommandId" --output text)

          echo "Command ID: $COMMAND_ID"
          sleep 3
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json | tee invocation.json

          STATUS=$(jq -r .Status invocation.json)
          if [ "$STATUS" != "Success" ]; then
            echo "Déploiement échoué (status=$STATUS)"
            exit 1
          fi
